{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="register-wrapper">
  <div class="register-card">
    <div class="text-center mb-4">
      <div class="auth-logo-icon mx-auto"><i class="bi bi-eye-fill"></i></div>
      <h2 class="mt-2 fw-bold">Create your LifeLens account</h2>
      <p class="text-muted small">Start tracking your financial, academic, and lifestyle journey</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <!-- Step 1: Basic -->
      <div class="register-section">
        <div class="register-section-title"><i class="bi bi-person-fill me-2"></i>Personal Details</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" name="name" class="form-control" placeholder="Alex Johnson" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password *</label>
            <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password *</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" placeholder="21" min="15" max="100"/>
          </div>
          <div class="col-md-8">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
              <option value="">Prefer not to say</option>
              <option>Male</option><option>Female</option><option>Non-binary</option><option>Other</option>
            </select>
          </div>
        </div>
      </div>

      <div class="register-section">
        <div class="register-section-title"><i class="bi bi-mortarboard-fill me-2"></i>Education</div>
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">College / University</label>
            <input type="text" name="college" class="form-control" placeholder="Tech University"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Current Year</label>
            <select name="current_year" class="form-select">
              <option value="">Year</option>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Degree</label>
            <input type="text" name="degree" class="form-control" placeholder="B.Tech Computer Science"/>
          </div>
          <div class="col-md-3">
            <label class="form-label">Current CGPA</label>
            <input type="number" name="cgpa" class="form-control" placeholder="7.8" step="0.01" min="0" max="10"/>
          </div>
          <div class="col-md-3">
            <label class="form-label">Target CGPA</label>
            <input type="number" name="target_cgpa" class="form-control" placeholder="9.0" step="0.01" min="0" max="10"/>
          </div>
        </div>
      </div>

      <div class="register-section">
        <div class="register-section-title"><i class="bi bi-currency-rupee me-2"></i>Financial Profile</div>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Monthly Income (₹)</label>
            <input type="number" name="monthly_income" class="form-control" placeholder="25000"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Monthly Expenses (₹)</label>
            <input type="number" name="monthly_expenses" class="form-control" placeholder="18000"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Savings Goal (₹)</label>
            <input type="number" name="savings_goal" class="form-control" placeholder="100000"/>
          </div>
        </div>
      </div>

      <div class="register-section">
        <div class="register-section-title"><i class="bi bi-lightning-fill me-2"></i>Goals</div>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Daily Study Goal (hrs)</label>
            <input type="number" name="daily_study_hours_goal" class="form-control" placeholder="5" step="0.5" min="1" max="16"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Sleep Goal (hrs)</label>
            <input type="number" name="sleep_goal" class="form-control" placeholder="8" step="0.5" min="4" max="12"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Exercise Goal (min/day)</label>
            <input type="number" name="exercise_goal" class="form-control" placeholder="30" min="0" max="240"/>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold mt-2">
        <i class="bi bi-rocket-takeoff-fill me-2"></i>Launch My Dashboard
      </button>
    </form>

    <div class="text-center mt-3 small text-muted">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
